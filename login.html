<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In · EDGAR TEE</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css" />

  <!--
    Auth-page-only styling lives inline for now. The shared design system
    (css/style.css) is built in Module 4 — once it exists, these rules
    will be folded into it so the login page inherits the same tokens
    (colors, spacing, type scale) rather than duplicating them.
  -->
  <style>
    :root {
      --auth-blue: #1a4d8f;
      --auth-blue-dark: #123a6b;
      --auth-blue-light: #eaf1fb;
      --auth-text: #1c2733;
      --auth-muted: #6b7785;
      --auth-border: #dde4ec;
      --auth-white: #ffffff;
      --auth-error: #c0392b;
      --auth-radius: 14px;
      --auth-shadow: 0 20px 50px rgba(26, 77, 143, 0.10);
    }

    * { box-sizing: border-box; }

    body.auth-body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--auth-blue-light) 0%, var(--auth-white) 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, "Times New Roman", serif;
      color: var(--auth-text);
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--auth-white);
      border: 1px solid var(--auth-border);
      border-radius: var(--auth-radius);
      box-shadow: var(--auth-shadow);
      padding: 40px 36px 32px;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand a {
      text-decoration: none;
      color: var(--auth-text);
    }

    .auth-brand .site-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--auth-blue);
      margin: 0;
    }

    .auth-brand .site-tagline {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--auth-muted);
      font-style: italic;
    }

    .auth-heading {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 4px;
      text-align: center;
    }

    .auth-subheading {
      font-size: 0.88rem;
      color: var(--auth-muted);
      text-align: center;
      margin: 0 0 28px;
    }

    .auth-field {
      margin-bottom: 18px;
    }

    .auth-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--auth-text);
    }

    .auth-field input {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--auth-border);
      border-radius: 10px;
      background: var(--auth-white);
      color: var(--auth-text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .auth-field input:focus {
      outline: none;
      border-color: var(--auth-blue);
      box-shadow: 0 0 0 3px rgba(26, 77, 143, 0.12);
    }

    .auth-submit {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--auth-white);
      background: var(--auth-blue);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      margin-top: 6px;
    }

    .auth-submit:hover { background: var(--auth-blue-dark); }
    .auth-submit:active { transform: translateY(1px); }
    .auth-submit:disabled {
      background: var(--auth-muted);
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .auth-message.is-error {
      display: block;
      background: #fdecea;
      color: var(--auth-error);
      border: 1px solid #f5c6c1;
    }

    .auth-message.is-info {
      display: block;
      background: var(--auth-blue-light);
      color: var(--auth-blue-dark);
      border: 1px solid #cfe0f5;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--auth-muted);
    }

    .auth-footer a {
      color: var(--auth-blue);
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .auth-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: var(--auth-white);
      border-radius: 50%;
      animation: auth-spin 0.6s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }

    @keyframes auth-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="auth-body">

  <main class="auth-card" role="main">
    <div class="auth-brand">
      <a href="index.html">
        <p class="site-title">EDGAR TEE</p>
        <p class="site-tagline">Search for Truth and Meaning</p>
      </a>
    </div>

    <h1 class="auth-heading">Admin Log In</h1>
    <p class="auth-subheading">This area is for site administration only.</p>

    <div id="auth-message" class="auth-message" role="alert" aria-live="polite"></div>

    <form id="login-form" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="auth-submit" id="submit-btn">Log In</button>
    </form>

    <p class="auth-footer">
      <a href="index.html">&larr; Back to EDGAR TEE</a>
    </p>
  </main>

  <script type="module">
    import { signIn, redirectIfAuthenticated } from './js/auth.js';

    // If an admin is already signed in, skip the form entirely.
    redirectIfAuthenticated('dashboard.html');

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('auth-message');

    function showMessage(text, type = 'error') {
      messageEl.textContent = text;
      messageEl.className = `auth-message is-${type}`;
    }

    function clearMessage() {
      messageEl.textContent = '';
      messageEl.className = 'auth-message';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.innerHTML = isLoading
        ? '<span class="auth-spinner" aria-hidden="true"></span>Logging in…'
        : 'Log In';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Please enter both email and password.');
        return;
      }

      setLoading(true);
      try {
        await signIn(email, password);
        // Success — the profiles.role check happens on the dashboard side
        // via requireAdmin(), which will bounce non-admins back here.
        window.location.href = 'dashboard.html';
      } catch (err) {
        showMessage(err.message || 'Log in failed. Please check your credentials.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
